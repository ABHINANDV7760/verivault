<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERI//VAULT — Authority Issuer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { void: '#050507', obsidian: '#0c0d12', neonGreen: '#00ff9d', neonBlue: '#00d2ff', neonRed: '#ff2a6d' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050507;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 157, 0.1) 0%, transparent 50%);
        }
        .glass { background: rgba(12, 13, 18, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .grid-bg { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); }
    </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen grid-bg flex flex-col justify-between selection:bg-neonGreen selection:text-void">

    <!-- Navbar with Page Switcher -->
    <nav class="border-b border-white/10 glass sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-neonGreen/10 border border-neonGreen/40 flex items-center justify-center text-neonGreen">
                    <i data-lucide="key-round" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">VERI<span class="text-neonGreen">//</span>VAULT</span>
            </a>

            <div class="flex items-center gap-3">
                <a href="index.html" class="px-3.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-zinc-300 hover:text-white text-xs font-mono transition flex items-center gap-1.5">
                    ← PUBLIC VERIFIER
                </a>
                <span class="px-3.5 py-1.5 rounded-lg bg-neonGreen/15 border border-neonGreen/40 text-neonGreen text-xs font-mono font-bold">
                    ISSUER CONSOLE
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Issuer Form -->
    <main class="max-w-2xl w-full mx-auto px-6 py-12 space-y-8">
        <div class="text-center space-y-2">
            <span class="inline-block px-3 py-1 rounded-full bg-neonGreen/10 border border-neonGreen/30 text-neonGreen text-xs font-mono">
                PRIVATE KEY SIGNING AUTHORITY
            </span>
            <h1 class="text-3xl md:text-4xl font-bold">Issue & Sign Certificate</h1>
            <p class="text-zinc-400 text-sm">Generate a cryptographic SHA-256 fingerprint and sign it with the authority RSA-2048 private key.</p>
        </div>

        <div class="glass rounded-3xl p-8 space-y-6 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1.5">CERTIFICATE / DOCUMENT ID</label>
                    <input type="text" id="docId" placeholder="e.g., UNIV-2026-8841" class="w-full bg-void border border-white/15 focus:border-neonGreen rounded-xl px-4 py-3 text-sm font-mono text-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1.5">SELECT ORIGINAL PDF</label>
                    <label for="issuerFile" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-white/15 hover:border-neonGreen/60 rounded-2xl cursor-pointer bg-void/50 hover:bg-neonGreen/5 transition group">
                        <i data-lucide="file-plus-2" class="w-8 h-8 text-zinc-500 group-hover:text-neonGreen mb-2 transition"></i>
                        <span id="fileNameLabel" class="text-xs font-mono text-zinc-400 group-hover:text-white">Click or drag original PDF here</span>
                        <input type="file" id="issuerFile" accept=".pdf" class="hidden" onchange="showFile()">
                    </label>
                </div>
            </div>

            <button onclick="signDocument()" id="signBtn" class="w-full py-4 rounded-xl bg-neonGreen text-void font-bold text-sm tracking-wide hover:brightness-110 active:scale-[0.99] transition flex items-center justify-center gap-2">
                <i data-lucide="fingerprint" class="w-4 h-4"></i> SIGN & MINT TO LEDGER
            </button>

            <div id="issuerResult" class="hidden rounded-2xl bg-void border border-white/10 p-5 font-mono text-xs space-y-2 overflow-x-auto"></div>
        </div>

        <!-- Offensive WAF Test Box -->
        <div class="glass rounded-2xl p-5 border border-neonRed/25 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2 text-neonRed font-bold text-sm">
                    <i data-lucide="skull" class="w-4 h-4"></i> Red-Team WAF Attack Test
                </div>
                <div class="flex gap-2">
                    <button onclick="simulateAttack('traversal')" class="px-3 py-1.5 rounded-lg bg-neonRed/10 hover:bg-neonRed/20 border border-neonRed/40 text-neonRed font-mono text-xs transition">
                        Test Path Traversal
                    </button>
                    <button onclick="simulateAttack('polyglot')" class="px-3 py-1.5 rounded-lg bg-neonRed/10 hover:bg-neonRed/20 border border-neonRed/40 text-neonRed font-mono text-xs transition">
                        Test Fake .EXE Payload
                    </button>
                </div>
            </div>
            <div id="attackResult" class="hidden rounded-xl bg-void p-3 font-mono text-xs text-neonGreen border border-neonGreen/30"></div>
        </div>
    </main>

    <footer class="text-center py-6 text-xs font-mono text-zinc-600">
        RSA-2048 PSS PADDING • SHA-256 CRYPTOGRAPHIC ENGINE
    </footer>

    <script>
        lucide.createIcons();

        // REPLACE WITH YOUR LIVE RENDER URL WHEN DEPLOYING
        const API_URL = "http://127.0.0.1:8000";

        function showFile() {
            const input = document.getElementById('issuerFile');
            if (input.files.length > 0) {
                document.getElementById('fileNameLabel').innerHTML = `<span class="text-neonGreen font-bold">${input.files[0].name}</span>`;
            }
        }

        async function signDocument() {
            const fileInput = document.getElementById('issuerFile');
            const docId = document.getElementById('docId').value || "DOC-" + Math.floor(1000 + Math.random() * 9000);
            const resultDiv = document.getElementById('issuerResult');

            if (fileInput.files.length === 0) { alert("Please select a PDF first."); return; }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const res = await fetch(`${API_URL}/api/issuer/sign?document_id=${encodeURIComponent(docId)}`, { method: 'POST', body: formData });
                const data = await res.json();
                resultDiv.classList.remove('hidden');

                if (!res.ok) {
                    resultDiv.innerHTML = `<div class="text-neonRed font-bold">[BLOCKED] ${data.detail}</div>`;
                } else {
                    resultDiv.innerHTML = `
                        <div class="text-neonGreen font-bold text-sm">✓ DOCUMENT SIGNED & RECORDED</div>
                        <div class="text-zinc-400">DOCUMENT ID: <span class="text-white">${data.document_id}</span></div>
                        <div class="text-zinc-400 break-all">SHA-256 HASH: <span class="text-neonBlue">${data.sha256_hash}</span></div>
                        <div class="text-zinc-400 break-all">RSA SIGNATURE: <span class="text-zinc-400">${data.signature.substring(0, 64)}...</span></div>
                        <div class="pt-2">
                            <a href="index.html" class="inline-block text-neonBlue underline">Go to Public Verifier Page to test this file →</a>
                        </div>
                    `;
                }
            } catch (e) {
                alert("Cannot connect to backend server.");
            }
        }

        async function simulateAttack(type) {
            const attackDiv = document.getElementById('attackResult');
            attackDiv.classList.remove('hidden');
            const formData = new FormData();
            if (type === 'traversal') {
                formData.append("file", new Blob(["%PDF-1.4 test"], { type: "application/pdf" }), "../../etc/passwd.pdf");
            } else {
                formData.append("file", new Blob(["MZ\x90\x00 fake exe"], { type: "application/pdf" }), "malware.pdf");
            }

            const res = await fetch(`${API_URL}/api/issuer/sign?document_id=ATTACK`, { method: 'POST', body: formData });
            const data = await res.json();
            attackDiv.innerHTML = `🛡️ WAF BLOCKED ATTACK (HTTP ${res.status}): ${data.detail}`;
        }
    </script>
</body>
</html>
